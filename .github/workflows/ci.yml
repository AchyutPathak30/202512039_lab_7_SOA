name: CampusConnect CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify API Gateway
        run: |
          cd api-gateway
          npm ci || npm install
          node --check server.js

      - name: Verify User Service
        run: |
          cd user-service
          npm ci || npm install
          node --check server.js

      - name: Verify Product Service
        run: |
          cd product-service
          npm ci || npm install
          node --check server.js

      - name: Verify Order Service
        run: |
          cd order-service
          npm ci || npm install
          node --check server.js

      - name: Validate Kubernetes Manifests
        run: |
          for file in k8s/*.yaml; do
            echo "Checking manifest: $file"
            node -e "const fs = require('fs'); const content = fs.readFileSync('$file', 'utf8'); if (!content.includes('apiVersion') || !content.includes('kind')) process.exit(1); console.log('  Valid Kubernetes Resource: ' + content.split('\n').filter(l => l.startsWith('kind:')).join(', '));"
          done
          echo "All Kubernetes manifests in k8s/ are valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Versioned Docker Images
        run: |
          echo "Building versioned Docker images for Git SHA: ${{ github.sha }}"
          docker build -t api-gateway:${{ github.sha }} -t api-gateway:latest ./api-gateway
          docker build -t user-service:${{ github.sha }} -t user-service:latest ./user-service
          docker build -t product-service:${{ github.sha }} -t product-service:latest ./product-service
          docker build -t order-service:${{ github.sha }} -t order-service:latest ./order-service
          echo "All microservice Docker images built and tagged successfully!"
